<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>AgentChatSystem — Files</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/files.css">
  <script src="/theme.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/files.js" defer></script>
</head>
<body class="files-page">
  <header class="files-header">
    <a class="brand" href="/" aria-label="AgentChatSystem home" data-i18n-aria-label="home">
      <span class="brand-mark"><svg class="icon"><use href="/vendor/icons.svg#arrow-left-right"></use></svg></span>
      <span class="brand-name">AgentChatSystem</span>
    </a>
    <div class="files-preferences">
      <label for="theme"><span data-i18n="theme">Theme</span>
        <select id="theme"><option value="system" data-i18n="themeSystem">System</option><option value="light" data-i18n="themeLight">Light</option><option value="dark" data-i18n="themeDark">Dark</option><option value="graphite" data-i18n="themeGraphite">Graphite</option><option value="ocean" data-i18n="themeOcean">Ocean</option><option value="sand" data-i18n="themeSand">Sand</option><option value="plum" data-i18n="themePlum">Plum</option></select>
      </label>
      <label for="language"><span data-i18n="language">Language</span>
        <select id="language" disabled><option value="ko" lang="ko">한국어</option><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option><option value="zh-CN" lang="zh-CN">简体中文</option><option value="zh-TW" lang="zh-TW">繁體中文</option><option value="ru" lang="ru">Русский</option><option value="de" lang="de">Deutsch</option></select>
      </label>
    </div>
  </header>
  <main class="files-main">
    <p class="form-error" id="language-error" role="alert" hidden></p>
    <div class="files-heading">
      <div><p class="files-eyebrow" data-i18n="channelFiles">Channel files</p><h1 id="files-channel" data-i18n="loading">Loading…</h1><p data-i18n="downloadHint">Download files from the server computer to this device.</p></div>
      <a class="button secondary" href="/" data-i18n="backToChat">Back to chat</a>
    </div>
    <nav class="files-tabs" aria-label="Folder" data-i18n-aria-label="fileFolder"><a id="files-shared">shared/</a><a id="files-logs">logs/</a><a id="files-board">board/</a></nav>
    <section class="files-panel" aria-label="Channel files" data-i18n-aria-label="channelFiles">
      <div class="files-toolbar">
        <nav id="files-breadcrumbs" class="files-breadcrumbs" aria-label="Folder path" data-i18n-aria-label="folderBreadcrumb"></nav>
        <button class="button secondary" id="files-refresh" type="button" data-i18n="refreshFiles">Refresh</button>
      </div>
      <div class="files-meta"><a id="files-up" data-i18n="parentFolder" hidden>Parent folder</a><p id="files-status" role="status" aria-live="polite"></p></div>
      <p class="form-error" id="files-error" role="alert" hidden></p>
      <table class="files-table" id="files-table" aria-busy="true">
        <thead><tr><th scope="col" data-i18n="fileName">Name</th><th scope="col" class="files-size" data-i18n="fileSize">Size</th><th scope="col" class="files-action"><span class="sr-only" data-i18n="download">Download</span></th></tr></thead>
        <tbody id="files-entries"></tbody>
      </table>
      <p class="files-empty" id="files-empty" data-i18n="noFiles" hidden>This folder is empty.</p>
      <nav class="files-pagination" aria-label="File pages" data-i18n-aria-label="filePagination"><a class="button secondary" id="files-previous" data-i18n="filePrevious" hidden>Previous</a><a class="button secondary" id="files-next" data-i18n="fileNext" hidden>Next</a></nav>
    </section>
  </main>
</body>
</html>
